[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fanuc-workbench"
version = "2.0.0"
description = "Extensible FANUC robot engineering workbench: backup, compare, restore, program/data analysis, live monitoring, fleet backup, commissioning, integration, diagnostics, projects, and documentation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7", "XlsxWriter>=3.2", "reportlab>=4.2", "paramiko>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["mcp>=1.30,<2"]

[project.scripts]
fanuc-workbench = "fanuc_workbench.app:main"
fanuc-workbench-mcp = "fanuc_workbench.bridge.mcp_server:main"
fanuc-workbench-doctor = "fanuc_workbench.bridge.doctor:main"
fanuc-workbench-extension = "fanuc_workbench.bridge.extensions_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fanuc_workbench*"]

[tool.setuptools.package-data]
fanuc_workbench = ["extensions/**/*.json", "extensions/**/*.py"]
