[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fanuc-mcp-server"
version = "26.1022.173617"
description = "MCP server and desktop workbench for FANUC robot files, diagnostics, and reviewed changes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7", "XlsxWriter>=3.2", "reportlab>=4.2", "paramiko>=3.5", "pywin32>=311; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["mcp==2.3.0", "universal-codex-tools==0.20.0"]

[project.scripts]
fanuc-mcp-server = "fanuc_workbench.bridge.stdio_supervisor:main"
fanuc-mcp-server-doctor = "fanuc_workbench.bridge.doctor:main"
fanuc-mcp-server-extension = "fanuc_workbench.bridge.extensions_cli:main"
fanuc-mcp-server-framework = "fanuc_workbench.bridge.framework_host:main"
fanuc-mcp-server-guidance = "fanuc_workbench.bridge.guidance:main"
fanuc-workbench = "fanuc_workbench.app:main"
fanuc-workbench-mcp = "fanuc_workbench.bridge.stdio_supervisor:main"
fanuc-workbench-doctor = "fanuc_workbench.bridge.doctor:main"
fanuc-workbench-extension = "fanuc_workbench.bridge.extensions_cli:main"

[project.gui-scripts]
fanuc-mcp-server-gui = "fanuc_workbench.app:main"

[project.urls]
Repository = "https://github.com/votecoffee/FanucMCPServer"

[tool.setuptools.packages.find]
where = ["."]
include = ["fanuc_workbench*"]

[tool.setuptools.package-data]
fanuc_workbench = ["extensions/**/*.json", "extensions/**/*.py", "extensions/**/*.txt", "licenses/*.txt", "licenses/*.md", "resources/*.ico", "resources/*.png", "resources/*.md", "guidance/**/*.md"]
